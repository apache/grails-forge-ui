name: Publish
on:
  push:
    branches:
      - main
  workflow_dispatch:
# Serialize this repo's own publishes: every run purges and rewrites /start.
# cancel-in-progress=false so an in-flight deploy finishes before the next.
# Cross-repo races on apache/grails-website are retried by deploy-github-pages@asf
# (apache/grails-github-actions#110). GitHub concurrency groups are repo-scoped.
concurrency:
  group: publish-grails-forge-ui
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'apache/grails-forge-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        java: ['25']
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'liberica'
          java-version: ${{ matrix.java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # 'basic' uses the MIT-licensed, open-source cache provider; the default 'enhanced' provider (v6+) is proprietary (Gradle commercial Terms of Use)
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY  }}
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: "🔨 Build project"
        run: ./gradlew build
      - name: "🚀 Publish to grails.apache.org/start"
        uses: apache/grails-github-actions/deploy-github-pages@asf
        env:
          # PAT with write access to apache/grails-website (same secret grails-core and grails-static-website use)
          GH_TOKEN: ${{ secrets.GRAILS_GHTOKEN }}
          GRADLE_PUBLISH_RELEASE: 'false'
          SOURCE_FOLDER: build/launch
          TARGET_REPOSITORY: apache/grails-website
          TARGET_FOLDER: '.'
          # Snapshot publishes to TARGET_FOLDER/LAST_SNAPSHOT_FOLDER; use start so the UI lands at /start/ instead of /snapshot/
          LAST_SNAPSHOT_FOLDER: start
          PURGE_EXISTING: 'true'
          DOCUMENTATION_BRANCH: asf-site-production
