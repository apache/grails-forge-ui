<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=https://grails.apache.org/start/" />
    <link rel="canonical" href="https://grails.apache.org/start/" />
    <title>Moved to grails.apache.org/start</title>
    <script>
      (function () {
        var dest = 'https://grails.apache.org/start'
        var path = window.location.pathname || '/'
        if (path === '/' || path === '/index.html') {
          path = '/'
        }
        window.location.replace(dest + path + window.location.search + window.location.hash)
      })()
    </script>
  </head>
  <body>
    <p>
      The Grails Application Forge has moved to
      <a href="https://grails.apache.org/start/">https://grails.apache.org/start/</a>.
    </p>
  </body>
